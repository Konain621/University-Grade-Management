services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    container_name: university-jenkins
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
    networks:
      - university-app

volumes:
  jenkins_home:

networks:
  university-app:
    driver: bridge

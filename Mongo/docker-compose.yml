version: '3.8'

services:
  # MongoDB
  mongo:
    image: mongo:5.0
    container_name: mongo
    volumes:
      - mongo_data:/data/db
    networks:
      - university-app
    ports:
      - "27017:27017"  # Optional: expose MongoDB port to host (useful for debugging)

  # Mongo Express
  mongo-express:
    image: mongo-express
    container_name: mongo-express
    ports:
      - "8081:8081"
    environment:
       MONGO_URI: mongodb://mongo:27017/university
       ME_CONFIG_MONGODB_SERVER: mongo
       ME_CONFIG_MONGODB_PORT: 27017
       ME_CONFIG_BASICAUTH_USERNAME: admin
       ME_CONFIG_BASICAUTH_PASSWORD: pass
    depends_on:
      - mongo
    networks:
      - university-app

volumes:
  mongo_data:

networks:
  university-app:
    external: true  # Assuming the external network 'university-app' already exists


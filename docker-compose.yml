version: "3.8"

services:
  mongo:
    image: mongo:5.0
    container_name: university-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - university-app

  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    container_name: university-jenkins
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - university-app

networks:
  university-app:
    driver: bridge

volumes:
  mongo_data:
  jenkins_home:
